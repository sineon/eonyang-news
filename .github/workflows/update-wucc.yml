name: 서울주문화센터 자동 업데이트

# 서울주문화센터 칸은 이제 scripts/update.mjs(학교 PC에서 매주 실행)가 함께 채운다.
# GitHub 서버에서는 ucf.or.kr 가 열리지 않아, 예약 실행 때마다 칸을 "등록된 행사 없음"으로 비워 왔다 → 예약은 끄고 수동만 남김.
on:
  workflow_dispatch:         # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 서울주문화센터 스크래핑 및 index.html 업데이트
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scrape_wucc.py
