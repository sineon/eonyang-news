name: 주간 소식지 자동 업데이트 (수동)

# 매주 발행은 학교 PC에서 한다: `node scripts/update.mjs --push` (윈도우 작업 스케줄러, 월요일 아침)
#   울주문화재단(ucf.or.kr)이 해외 서버(GitHub Actions)의 접속을 막아, 여기서 돌리면 행사를 읽지 못한다
#   (2026. 6. 28.부터 서울주문화센터 칸이 비어 온 원인). 예전 scripts/update.py 는 5. 7. 이후 파일 끝이 잘려 있었다.
# 여기에는 수동 실행 버튼만 남긴다 — 행사를 하나도 못 읽으면 스크립트가 index.html 을 바꾸지 않고 끝난다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 소식지 발행
        run: |
          git config user.name  "newsletter-bot"
          git config user.email "bot@sineon.github.io"
          node scripts/update.mjs --push
